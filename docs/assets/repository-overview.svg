<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc">
  <title id="title">From a request to a measured mix</title>
  <desc id="desc">Typed or dictated text enters Codex. Local MCP and a Python Control Surface apply the requested edit in Ableton Live. Live's Main WAV is measured locally for peak and loudness.</desc>
  <path d="M0 0h1000v375H0z" fill="#f5f0e4"/>
  <g fill="#202b25" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
    <text x="44" y="47" font-size="14" font-weight="700" letter-spacing="3">LOCAL AUDIO WORKFLOW</text>
    <text x="43" y="93" font-size="43" font-weight="750">From a request to a measured mix</text>
  </g>
  <path d="M44 118H956" stroke="#202b25" stroke-width="2"/>
  <g fill="#202b25" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="700">
    <text x="44" y="175">Codex</text>
    <text x="306" y="175">Ableton Live</text>
    <text x="602" y="175">Main WAV</text>
    <text x="807" y="175">Local meter</text>
  </g>
  <g fill="#3b463d" font-family="Georgia,serif" font-size="17">
    <text x="44" y="201">Type or dictate an edit</text>
    <text x="306" y="201">Apply it to the Set</text>
    <text x="602" y="201">Export the mix</text>
    <text x="807" y="201">Peak and loudness</text>
  </g>
  <path d="M44 226h166v50H44z" fill="#ded7c6"/>
  <path d="M306 218h211v67H306z" fill="#d98954"/>
  <path d="M602 231h151v40H602z" fill="#e1d8c5"/>
  <path d="M807 215h149v73H807z" fill="#234b3d"/>
  <g stroke="#202b25" stroke-width="2.6" fill="none">
    <path d="M220 251h66"/>
    <path d="M527 251h55"/>
    <path d="M764 251h24"/>
  </g>
  <path d="M285 246l9 5-9 5z M581 246l9 5-9 5z M787 246l9 5-9 5z" fill="#202b25"/>
  <g stroke="#202b25" stroke-width="3" fill="none">
    <path d="M64 244h110m-110 13h73"/>
    <path d="M326 237h168m-168 14h168m-168 14h168m-125-35v42m75-42v42"/>
    <path d="M615 251h13l6-8 6 15 8-19 9 25 7-13h10l8-7 7 14 9-20 9 25 8-12h26"/>
  </g>
  <g stroke="#fff9ea" stroke-width="4" fill="none">
    <path d="M827 270v-15m12 15v-25m12 25v-35m12 35v-28m12 28v-43"/>
  </g>
  <text x="888" y="268" fill="#fff9ea" font-family="Arial,sans-serif" font-weight="700" font-size="18">LUFS</text>
  <path d="M44 310H956" stroke="#90938a" stroke-width="1"/>
  <text x="44" y="343" fill="#3b463d" font-family="Georgia,serif" font-size="17">A Python Control Surface applies edits. FFmpeg measures the export locally.</text>
</svg>
